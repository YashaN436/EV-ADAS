<!DOCTYPE html>
<html>

<head>

    <title>EV + ADAS Dashboard</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            margin: 0;
        }

        h1 {
            margin-top: 30px;
            font-size: 36px;
        }

        .status {
            font-size: 28px;
            font-weight: bold;
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
        }

        .safe {
            color: #00ff88;
        }

        .warning {
            color: #ffcc00;
        }

        .danger {
            color: #ff3333;
        }
.adas-panel {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    width: 85%;
    margin: 20px auto 40px;
}

.adas-item {
    background: #222;
    padding: 20px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.adas-item span {
    font-size: 16px;
    font-weight: bold;
}

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 85%;
            margin: 40px auto;
        }

        .card {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            font-size: 22px;
        }

        .value {
            font-size: 40px;
            font-weight: bold;
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <h1>⚡ ELECTRIC VEHICLE DASHBOARD</h1>

    <div id="adas" class="status safe">
        🟢 SYSTEM SAFE
    </div>
    <h2>🚨 ADAS WARNING SYSTEM</h2>

    <div class="adas-panel">

        <div id="speedWarning" class="adas-item safe">
            🚗 HIGH SPEED
            <span>SAFE</span>
        </div>

        <div id="batteryWarning" class="adas-item safe">
            🔋 LOW BATTERY
            <span>SAFE</span>
        </div>

        <div id="temperatureWarning" class="adas-item safe">
            🌡️ MOTOR OVERHEATING
            <span>SAFE</span>
        </div>

        <div id="collisionWarning" class="adas-item safe">
            🚨 COLLISION WARNING
            <span>SAFE</span>
        </div>

    </div>

    <div class="dashboard">

        <div class="card">
            🚗 Speed
            <div class="value">
                <span id="speed">--</span> km/h
            </div>
        </div>

        <div class="card">
            🔋 Battery
            <div class="value">
                <span id="battery">--</span> %
            </div>
        </div>

        <div class="card">
            ⚡ Voltage
            <div class="value">
                <span id="voltage">--</span> V
            </div>
        </div>

        <div class="card">
            🌡️ Motor Temperature
            <div class="value">
                <span id="temperature">--</span> °C
            </div>
        </div>

        <div class="card">
            📍 Distance
            <div class="value">
                <span id="distance">--</span> km
            </div>
        </div>

    </div>

    <script>

        function updateDashboard() {

            fetch("/sensor-data")

                .then(response => response.json())

                .then(data => {

                    document.getElementById("speed").textContent =
                        data.speed;

                    document.getElementById("battery").textContent =
                        data.battery;

                    document.getElementById("voltage").textContent =
                        data.voltage;

                    document.getElementById("temperature").textContent =
                        data.temperature;

                    document.getElementById("distance").textContent =
                        data.distance;

                    updateADAS(data);

                })

                .catch(error => {

                    console.error("Sensor error:", error);

                });

        }

function updateADAS(data) {

    const adas = document.getElementById("adas");

    // Overall ADAS status
    if (data.risk === "CRITICAL") {

        adas.textContent = "🚨 " + data.adas_status;
        adas.className = "status danger";

    }

    else if (data.risk === "WARNING") {

        adas.textContent = "⚠️ " + data.adas_status;
        adas.className = "status warning";

    }

    else {

        adas.textContent = "🟢 SYSTEM SAFE";
        adas.className = "status safe";

    }


    // Get warning list from backend
    const warnings = data.warnings || [];


    // HIGH SPEED
    const speedWarning = document.getElementById("speedWarning");

    if (warnings.includes("HIGH SPEED")) {

        speedWarning.className = "adas-item danger";
        speedWarning.querySelector("span").textContent = "WARNING";

    }

    else {

        speedWarning.className = "adas-item safe";
        speedWarning.querySelector("span").textContent = "SAFE";

    }


    // LOW BATTERY
    const batteryWarning = document.getElementById("batteryWarning");

    if (warnings.includes("LOW BATTERY")) {

        batteryWarning.className = "adas-item danger";
        batteryWarning.querySelector("span").textContent = "WARNING";

    }

    else {

        batteryWarning.className = "adas-item safe";
        batteryWarning.querySelector("span").textContent = "SAFE";

    }


    // MOTOR OVERHEATING
    const temperatureWarning =
        document.getElementById("temperatureWarning");

    if (warnings.includes("MOTOR OVERHEATING")) {

        temperatureWarning.className = "adas-item danger";
        temperatureWarning.querySelector("span").textContent = "WARNING";

    }

    else {

        temperatureWarning.className = "adas-item safe";
        temperatureWarning.querySelector("span").textContent = "SAFE";

    }


    // COLLISION WARNING
    const collisionWarning =
        document.getElementById("collisionWarning");

    if (warnings.includes("COLLISION WARNING")) {

        collisionWarning.className = "adas-item danger";
        collisionWarning.querySelector("span").textContent = "WARNING";

    }

    else {

        collisionWarning.className = "adas-item safe";
        collisionWarning.querySelector("span").textContent = "SAFE";

    }

}

        updateDashboard();

        setInterval(updateDashboard, 1000);

    </script>

</body>

</html>
